[project]
name = "fastapi-learn-1"
version = "0.1.0"
description = "Async streaming video + OpenCV workstation MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "opencv-python-headless>=4.10.0",
    "numpy>=2.0.0",
]

[project.scripts]
stream-server = "app.__main__:main"

[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
