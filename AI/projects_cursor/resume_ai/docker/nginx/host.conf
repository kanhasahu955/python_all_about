# Host Nginx when PM2 runs frontend (5173), backend (8000), AI worker (8765) on localhost.
#   sudo cp docker/nginx/host.conf /etc/nginx/sites-available/resume-ai
#   sudo ln -sf /etc/nginx/sites-available/resume-ai /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

upstream resume_frontend_pm2 {
    server 127.0.0.1:5173;
    keepalive 16;
}

upstream resume_backend_pm2 {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream resume_ai_pm2 {
    server 127.0.0.1:8765;
    keepalive 8;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://resume_backend_pm2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /health {
        proxy_pass http://resume_backend_pm2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ai/ {
        proxy_pass http://resume_ai_pm2/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://resume_frontend_pm2;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
