<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="hero" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#172033"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#4ade80"/>
    </marker>
  </defs>

  <rect width="1600" height="2200" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="40" y="30" width="1520" height="110" rx="20" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="80" y="78" fill="#ffffff" font-size="34" font-weight="700">Agentic Resume AI Platform</text>
  <text x="80" y="112" fill="#e0e7ff" font-size="18">Complete System Architecture &amp; Application Flow</text>
  <text x="1320" y="88" fill="#ffffff" font-size="15" font-weight="600">FastAPI + LangGraph + RAG</text>
  <text x="1320" y="112" fill="#dbeafe" font-size="13">Streamlit · Groq · Pinecone · Redis</text>

  <!-- Section 1 label -->
  <text x="80" y="190" fill="#93c5fd" font-size="14" font-weight="700" letter-spacing="2">01  HIGH-LEVEL ARCHITECTURE</text>

  <!-- Frontend -->
  <rect x="60" y="220" width="420" height="300" rx="18" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <rect x="60" y="220" width="420" height="44" rx="18" fill="#1d4ed8"/>
  <rect x="60" y="242" width="420" height="22" fill="#1d4ed8"/>
  <text x="85" y="250" fill="#fff" font-size="18" font-weight="700">Streamlit Frontend :8501</text>
  <text x="85" y="290" fill="#cbd5e1" font-size="14">Pages</text>
  <text x="85" y="315" fill="#94a3b8" font-size="13">" Upload Resume (live agent timeline)</text>
  <text x="85" y="338" fill="#94a3b8" font-size="13">" Resume Analyzer · Dashboard</text>
  <text x="85" y="361" fill="#94a3b8" font-size="13">" RAG Search · Agent Runs · Settings</text>
  <text x="85" y="384" fill="#94a3b8" font-size="13">" Resume Builder · Interview Generator</text>
  <text x="85" y="420" fill="#cbd5e1" font-size="14">Services</text>
  <text x="85" y="445" fill="#94a3b8" font-size="13">resume_api · stream_api · rag_api · agent_api</text>
  <text x="85" y="475" fill="#cbd5e1" font-size="14">Live UX</text>
  <text x="85" y="500" fill="#86efac" font-size="13">SSE token stream · agent_feed timeline</text>

  <!-- Backend -->
  <rect x="520" y="220" width="560" height="300" rx="18" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <rect x="520" y="220" width="560" height="44" rx="18" fill="#7c3aed"/>
  <rect x="520" y="242" width="560" height="22" fill="#7c3aed"/>
  <text x="545" y="250" fill="#fff" font-size="18" font-weight="700">FastAPI Backend :8000</text>
  <text x="545" y="290" fill="#cbd5e1" font-size="14">REST API</text>
  <text x="545" y="315" fill="#94a3b8" font-size="13">/api/v1/resumes · /rag · /agents · /jobs · /datasources</text>
  <text x="545" y="345" fill="#cbd5e1" font-size="14">Streaming</text>
  <text x="545" y="370" fill="#94a3b8" font-size="13">GET /stream/analysis/{id}  (SSE)</text>
  <text x="545" y="393" fill="#94a3b8" font-size="13">POST /stream/llm  ·  WS /ws/analysis/{id}</text>
  <text x="545" y="423" fill="#cbd5e1" font-size="14">Core Services</text>
  <text x="545" y="448" fill="#94a3b8" font-size="13">resume_service · rag_service · agent_events · datasource_service</text>
  <text x="545" y="478" fill="#cbd5e1" font-size="14">Core</text>
  <text x="545" y="503" fill="#94a3b8" font-size="13">config · database · llm · llm_stream · connections · redis_client</text>

  <!-- Worker -->
  <rect x="1120" y="220" width="420" height="300" rx="18" fill="url(#card)" stroke="#334155" filter="url(#shadow)"/>
  <rect x="1120" y="220" width="420" height="44" rx="18" fill="#059669"/>
  <rect x="1120" y="242" width="420" height="22" fill="#059669"/>
  <text x="1145" y="250" fill="#fff" font-size="18" font-weight="700">RQ Worker (Background)</text>
  <text x="1145" y="290" fill="#cbd5e1" font-size="14">Queue</text>
  <text x="1145" y="315" fill="#94a3b8" font-size="13">python -m app.jobs.worker</text>
  <text x="1145" y="345" fill="#cbd5e1" font-size="14">Pipeline</text>
  <text x="1145" y="370" fill="#94a3b8" font-size="13">resume_jobs.run_resume_analysis_job()</text>
  <text x="1145" y="393" fill="#94a3b8" font-size="13">LangGraph resume_graph.stream()</text>
  <text x="1145" y="423" fill="#cbd5e1" font-size="14">Observability</text>
  <text x="1145" y="448" fill="#94a3b8" font-size="13">AgentRun records · Langfuse hooks</text>
  <text x="1145" y="478" fill="#cbd5e1" font-size="14">Events</text>
  <text x="1145" y="503" fill="#86efac" font-size="13">Redis pub/sub agent.token · agent.progress</text>

  <!-- Arrows between tiers -->
  <line x1="480" y1="370" x2="520" y2="370" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="488" y="358" fill="#93c5fd" font-size="11">REST</text>
  <line x1="480" y1="400" x2="520" y2="400" stroke="#4ade80" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="488" y="418" fill="#86efac" font-size="11">SSE</text>
  <line x1="1080" y1="370" x2="1120" y2="370" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1088" y="358" fill="#93c5fd" font-size="11">enqueue</text>
  <line x1="1080" y1="430" x2="1120" y2="430" stroke="#4ade80" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="1088" y="448" fill="#86efac" font-size="11">events</text>

  <!-- External Services -->
  <text x="80" y="580" fill="#93c5fd" font-size="14" font-weight="700" letter-spacing="2">EXTERNAL SERVICES &amp; DATA</text>
  <rect x="60" y="600" width="230" height="90" rx="14" fill="#172033" stroke="#475569"/>
  <text x="85" y="635" fill="#f8fafc" font-size="15" font-weight="600">Groq LLM</text>
  <text x="85" y="658" fill="#94a3b8" font-size="12">llama-3.3-70b-versatile</text>
  <text x="85" y="678" fill="#64748b" font-size="11">Skills · JD · Resume · Interview</text>

  <rect x="310" y="600" width="230" height="90" rx="14" fill="#172033" stroke="#475569"/>
  <text x="335" y="635" fill="#f8fafc" font-size="15" font-weight="600">OpenAI Embeddings</text>
  <text x="335" y="658" fill="#94a3b8" font-size="12">text-embedding-3-small</text>
  <text x="335" y="678" fill="#64748b" font-size="11">RAG vectorization</text>

  <rect x="560" y="600" width="230" height="90" rx="14" fill="#172033" stroke="#475569"/>
  <text x="585" y="635" fill="#f8fafc" font-size="15" font-weight="600">Pinecone</text>
  <text x="585" y="658" fill="#94a3b8" font-size="12">Vector index · semantic search</text>
  <text x="585" y="678" fill="#64748b" font-size="11">Auto-create index · reindex API</text>

  <rect x="810" y="600" width="230" height="90" rx="14" fill="#172033" stroke="#475569"/>
  <text x="835" y="635" fill="#f8fafc" font-size="15" font-weight="600">Redis :6379</text>
  <text x="835" y="658" fill="#94a3b8" font-size="12">RQ job queue</text>
  <text x="835" y="678" fill="#64748b" font-size="11">Pub/sub live agent events</text>

  <rect x="1060" y="600" width="230" height="90" rx="14" fill="#172033" stroke="#475569"/>
  <text x="1085" y="635" fill="#f8fafc" font-size="15" font-weight="600">SQL Database</text>
  <text x="1085" y="658" fill="#94a3b8" font-size="12">Snowflake / MySQL / Databricks</text>
  <text x="1085" y="678" fill="#64748b" font-size="11">ResumeDocument · Analysis · AgentRun</text>

  <rect x="1310" y="600" width="230" height="90" rx="14" fill="#172033" stroke="#475569"/>
  <text x="1335" y="635" fill="#f8fafc" font-size="15" font-weight="600">Local Storage</text>
  <text x="1335" y="658" fill="#94a3b8" font-size="12">storage/resumes/*.pdf</text>
  <text x="1335" y="678" fill="#64748b" font-size="11">Uploaded resume files</text>

  <!-- Section 2 LangGraph -->
  <text x="80" y="760" fill="#93c5fd" font-size="14" font-weight="700" letter-spacing="2">02  LANGGRAPH AGENT PIPELINE</text>
  <rect x="60" y="785" width="1480" height="220" rx="18" fill="#111827" stroke="#334155" filter="url(#shadow)"/>

  <!-- Pipeline nodes -->
  <g>
    <rect x="90" y="850" width="200" height="100" rx="14" fill="#0c4a6e" stroke="#38bdf8"/>
    <text x="110" y="885" fill="#e0f2fe" font-size="14" font-weight="700">` parse_resume</text>
    <text x="110" y="908" fill="#bae6fd" font-size="12">ResumeParserAgent</text>
    <text x="110" y="928" fill="#7dd3fc" font-size="11">PyPDF ’ resume_text</text>

    <rect x="330" y="850" width="200" height="100" rx="14" fill="#1e3a8a" stroke="#60a5fa"/>
    <text x="350" y="885" fill="#dbeafe" font-size="14" font-weight="700">a extract_skills</text>
    <text x="350" y="908" fill="#93c5fd" font-size="12">SkillExtractorAgent</text>
    <text x="350" y="928" fill="#60a5fa" font-size="11">Groq stream ’ skills_json</text>

    <rect x="570" y="850" width="200" height="100" rx="14" fill="#4c1d95" stroke="#a78bfa"/>
    <text x="590" y="885" fill="#ede9fe" font-size="14" font-weight="700">b rag_search</text>
    <text x="590" y="908" fill="#c4b5fd" font-size="12">RAGAgent</text>
    <text x="590" y="928" fill="#a78bfa" font-size="11">Pinecone ’ rag_context</text>

    <rect x="810" y="850" width="200" height="100" rx="14" fill="#831843" stroke="#f472b6"/>
    <text x="830" y="885" fill="#fce7f3" font-size="14" font-weight="700">c match_jd</text>
    <text x="830" y="908" fill="#fbcfe8" font-size="12">JDMatcherAgent</text>
    <text x="830" y="928" fill="#f472b6" font-size="11">Groq stream ’ jd_match_json</text>

    <rect x="1050" y="850" width="200" height="100" rx="14" fill="#14532d" stroke="#4ade80"/>
    <text x="1070" y="885" fill="#dcfce7" font-size="14" font-weight="700">d build_resume</text>
    <text x="1070" y="908" fill="#bbf7d0" font-size="12">ResumeBuilderAgent</text>
    <text x="1070" y="928" fill="#4ade80" font-size="11">Groq stream ’ optimized_resume</text>

    <rect x="1290" y="850" width="200" height="100" rx="14" fill="#134e4a" stroke="#2dd4bf"/>
    <text x="1310" y="885" fill="#ccfbf1" font-size="14" font-weight="700">e index</text>
    <text x="1310" y="908" fill="#99f6e4" font-size="12">RAGService</text>
    <text x="1310" y="928" fill="#2dd4bf" font-size="11">Pinecone upsert</text>

    <line x1="290" y1="900" x2="330" y2="900" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="530" y1="900" x2="570" y2="900" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="770" y1="900" x2="810" y2="900" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1010" y1="900" x2="1050" y2="900" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1250" y1="900" x2="1290" y2="900" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <text x="90" y="820" fill="#64748b" font-size="12">State flows through ResumeGraphState: document_id · file_path · job_description · resume_text · skills_json · rag_context · jd_match_json · optimized_resume</text>

  <!-- Section 3 Real-time flow -->
  <text x="80" y="1060" fill="#93c5fd" font-size="14" font-weight="700" letter-spacing="2">03  REAL-TIME STREAMING FLOW (ChatGPT / Cursor style)</text>
  <rect x="60" y="1085" width="1480" height="380" rx="18" fill="#111827" stroke="#334155" filter="url(#shadow)"/>

  <!-- Flow steps -->
  <rect x="90" y="1125" width="180" height="70" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="110" y="1155" fill="#f1f5f9" font-size="13" font-weight="600">1. Upload PDF</text>
  <text x="110" y="1175" fill="#94a3b8" font-size="11">POST /resumes/upload</text>

  <rect x="300" y="1125" width="180" height="70" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="320" y="1155" fill="#f1f5f9" font-size="13" font-weight="600">2. Enqueue Job</text>
  <text x="320" y="1175" fill="#94a3b8" font-size="11">RQ ’ Redis queue</text>

  <rect x="510" y="1125" width="180" height="70" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="530" y="1155" fill="#f1f5f9" font-size="13" font-weight="600">3. Open SSE</text>
  <text x="530" y="1175" fill="#94a3b8" font-size="11">/stream/analysis/{id}</text>

  <rect x="720" y="1125" width="180" height="70" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="740" y="1155" fill="#f1f5f9" font-size="13" font-weight="600">4. Worker Runs</text>
  <text x="740" y="1175" fill="#94a3b8" font-size="11">LangGraph stream()</text>

  <rect x="930" y="1125" width="180" height="70" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="950" y="1155" fill="#f1f5f9" font-size="13" font-weight="600">5. Publish Events</text>
  <text x="950" y="1175" fill="#94a3b8" font-size="11">Redis pub/sub</text>

  <rect x="1140" y="1125" width="180" height="70" rx="12" fill="#1e293b" stroke="#475569"/>
  <text x="1160" y="1155" fill="#f1f5f9" font-size="13" font-weight="600">6. UI Timeline</text>
  <text x="1160" y="1175" fill="#94a3b8" font-size="11">agent_feed component</text>

  <rect x="1350" y="1125" width="160" height="70" rx="12" fill="#14532d" stroke="#4ade80"/>
  <text x="1370" y="1155" fill="#dcfce7" font-size="13" font-weight="600">7. Complete</text>
  <text x="1370" y="1175" fill="#86efac" font-size="11">DB + Pinecone</text>

  <line x1="270" y1="1160" x2="300" y2="1160" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="1160" x2="510" y2="1160" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="1160" x2="720" y2="1160" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="1160" x2="930" y2="1160" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1110" y1="1160" x2="1140" y2="1160" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1320" y1="1160" x2="1350" y2="1160" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Event types box -->
  <rect x="90" y="1230" width="680" height="200" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="110" y="1260" fill="#e2e8f0" font-size="15" font-weight="700">Live Event Types</text>
  <text x="110" y="1290" fill="#86efac" font-size="12">pipeline.started / pipeline.completed / pipeline.failed</text>
  <text x="110" y="1312" fill="#93c5fd" font-size="12">agent.started / agent.completed / agent.failed</text>
  <text x="110" y="1334" fill="#fcd34d" font-size="12">agent.token  Groq tokens streamed live (partial text + cursor)</text>
  <text x="110" y="1356" fill="#f9a8d4" font-size="12">agent.progress  PDF pages, Pinecone retrieval status</text>
  <text x="110" y="1378" fill="#5eead4" font-size="12">rag.indexed  resume vectorized into Pinecone</text>
  <text x="110" y="1405" fill="#64748b" font-size="11">Buffered in Redis list · Live tokens via pub/sub only</text>

  <!-- Channels box -->
  <rect x="810" y="1230" width="700" height="200" rx="14" fill="#0f172a" stroke="#334155"/>
  <text x="830" y="1260" fill="#e2e8f0" font-size="15" font-weight="700">Delivery Channels</text>
  <text x="830" y="1290" fill="#93c5fd" font-size="12">SSE: GET /api/v1/stream/analysis/{document_id}</text>
  <text x="830" y="1312" fill="#93c5fd" font-size="12">WebSocket: ws://localhost:8000/ws/analysis/{document_id}</text>
  <text x="830" y="1334" fill="#93c5fd" font-size="12">History: GET /api/v1/agents/runs/{document_id}/events</text>
  <text x="830" y="1365" fill="#64748b" font-size="11">Streamlit consumes SSE via stream_api.py</text>
  <text x="830" y="1387" fill="#64748b" font-size="11">agent_feed.py renders timeline + live token output</text>

  <!-- Section 4 Data model -->
  <text x="80" y="1520" fill="#93c5fd" font-size="14" font-weight="700" letter-spacing="2">04  DATA MODEL &amp; STATUS LIFECYCLE</text>
  <rect x="60" y="1545" width="720" height="280" rx="18" fill="#111827" stroke="#334155" filter="url(#shadow)"/>
  <text x="90" y="1580" fill="#e2e8f0" font-size="15" font-weight="700">Database Tables (SQLModel)</text>
  <rect x="90" y="1600" width="200" height="90" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="110" y="1630" fill="#f8fafc" font-size="13" font-weight="600">ResumeDocument</text>
  <text x="110" y="1652" fill="#94a3b8" font-size="11">document_id · file_name</text>
  <text x="110" y="1670" fill="#94a3b8" font-size="11">file_path · content_text · status</text>
  <rect x="310" y="1600" width="200" height="90" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="330" y="1630" fill="#f8fafc" font-size="13" font-weight="600">ResumeAnalysis</text>
  <text x="330" y="1652" fill="#94a3b8" font-size="11">skills_json · jd_match_json</text>
  <text x="330" y="1670" fill="#94a3b8" font-size="11">optimized_resume · interview_questions</text>
  <rect x="530" y="1600" width="200" height="90" rx="10" fill="#1e293b" stroke="#475569"/>
  <text x="550" y="1630" fill="#f8fafc" font-size="13" font-weight="600">AgentRun</text>
  <text x="550" y="1652" fill="#94a3b8" font-size="11">agent_name · status</text>
  <text x="550" y="1670" fill="#94a3b8" font-size="11">input_json · output_json</text>
  <text x="90" y="1725" fill="#64748b" font-size="12">Also: DataSource · BackgroundJob</text>
  <text x="90" y="1755" fill="#cbd5e1" font-size="13">Status lifecycle:</text>
  <text x="90" y="1780" fill="#86efac" font-size="13">queued ’ processing ’ analyzed  (or failed)</text>

  <rect x="820" y="1545" width="720" height="280" rx="18" fill="#111827" stroke="#334155" filter="url(#shadow)"/>
  <text x="850" y="1580" fill="#e2e8f0" font-size="15" font-weight="700">Deployment (make run)</text>
  <text x="850" y="1615" fill="#94a3b8" font-size="13">make redis-up ’ starts Redis (Docker or local brew)</text>
  <text x="850" y="1640" fill="#94a3b8" font-size="13">RQ Worker ’ python -m app.jobs.worker</text>
  <text x="850" y="1665" fill="#94a3b8" font-size="13">FastAPI ’ uvicorn app.main:app :8000</text>
  <text x="850" y="1690" fill="#94a3b8" font-size="13">Streamlit ’ frontend/app.py :8501</text>
  <text x="850" y="1725" fill="#cbd5e1" font-size="13">Config: AI/.env · deps: AI/pyproject.toml (uv)</text>
  <text x="850" y="1755" fill="#64748b" font-size="12">Docker Compose: api + worker + mysql + redis</text>
  <text x="850" y="1780" fill="#64748b" font-size="12">Current local setup: Snowflake DB + Redis queue + Pinecone RAG</text>

  <!-- Footer -->
  <rect x="60" y="1860" width="1480" height="90" rx="16" fill="#172033" stroke="#334155"/>
  <text x="90" y="1895" fill="#e2e8f0" font-size="14" font-weight="600">Agentic Resume AI  resume_rag/</text>
  <text x="90" y="1920" fill="#94a3b8" font-size="12">Upload PDF ’ LangGraph agents (Groq + Pinecone) ’ live SSE/WebSocket feed ’ Snowflake/MySQL + vector index</text>
  <text x="90" y="1940" fill="#64748b" font-size="11">Generated architecture diagram · AI/projects_cursor/resume_rag/assets/</text>
</svg>
