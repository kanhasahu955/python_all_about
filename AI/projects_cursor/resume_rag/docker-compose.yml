services:
  api:
    build:
      context: ../..
      dockerfile: projects_cursor/resume_rag/dockerfile
    container_name: resume_ai_api
    ports:
      - "8000:8000"
    env_file:
      - ../../.env
    environment:
      DB_PROVIDER: mysql
      USE_REDIS_QUEUE: "true"
    depends_on:
      - mysql
      - redis
    volumes:
      - ./storage:/app/storage

  worker:
    build:
      context: ../..
      dockerfile: projects_cursor/resume_rag/dockerfile
    container_name: resume_ai_worker
    command: python -m app.jobs.worker
    env_file:
      - ../../.env
    environment:
      DB_PROVIDER: mysql
      USE_REDIS_QUEUE: "true"
    depends_on:
      - mysql
      - redis
    volumes:
      - ./storage:/app/storage

  mysql:
    image: mysql:8.0
    container_name: resume_ai_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: resume_ai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: resume_ai_redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
