[project]
name = "ai"
version = "0.1.0"
description = "AI experiments with LangChain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-groq",
    "langchain-huggingface",
    "langchain-cohere",
    "langchain-deepseek",
    "langsmith",
    "openai",
    "anthropic",
    "groq",
    "langchain-google-genai",
    "cohere",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "ipykernel",
    "jupyter",
    "streamlit",
    "langchain-ollama",
    "pinecone",
    "python-multipart",
    "sqlmodel",
    "sqlalchemy",
    "snowflake-sqlalchemy",
    "snowflake-connector-python",
    "databricks-sql-connector",
    "uvicorn",
    "pypdf",
    "pandas",
    "numpy"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config"]


