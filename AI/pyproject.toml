[project]
name = "ai"
version = "0.1.0"
description = "AI experiments with LangChain"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-groq",
    "langchain-huggingface",
    "langchain-cohere",
    "langchain-deepseek",
    "langchain-text-splitters",
    "langgraph",
    "langsmith",
    "openai",
    "anthropic",
    "groq",
    "langchain-google-genai",
    "cohere",
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "ipykernel",
    "jupyter",
    "streamlit",
    "langchain-ollama",
    "pinecone",
    "python-multipart",
    "sqlmodel",
    "sqlalchemy",
    "snowflake-sqlalchemy",
    "snowflake-connector-python",
    "databricks-sqlalchemy",
    "databricks-sql-connector",
    "uvicorn[standard]",
    "pypdf",
    "pandas",
    "numpy",
    "pymysql",
    "redis",
    "rq",
    "python-docx",
    "requests",
    "httpx",
    "websocket-client",
    "python-socketio",
    "websockets",
    "rich",
    "insightface",
    "opencv-python",
    "langfuse",
    "sentence-transformers",
    "tiktoken",
    "faster-whisper",
    "soundfile",
    "librosa",
    "pydub",
    "livekit",
    "livekit-api",
    "livekit-agents",
    "onnxruntime",
    "mediapipe",
    "celery",
    "Pillow",
    "fastapi-mail",
    "pyotp",
    "instructor",
    "sentry-sdk[fastapi]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config"]


